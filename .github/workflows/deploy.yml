name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Sync latest projects from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-projects.mjs

      - name: Generate static site
        run: yarn generate

      - name: Write CMS OAuth credentials
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GH_OAUTH_CLIENT_ID" ] || [ -z "$GH_OAUTH_CLIENT_SECRET" ]; then
            echo "::warning::GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET not set; /admin login will not work"
            exit 0
          fi
          node - <<'EOF'
          const fs = require('fs');
          const q = (s) => "'" + s.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
          fs.writeFileSync('dist/auth/config.php',
            `<?php\nreturn [\n  'client_id' => ${q(process.env.GH_OAUTH_CLIENT_ID)},\n  'client_secret' => ${q(process.env.GH_OAUTH_CLIENT_SECRET)},\n];\n`);
          EOF

      - name: Deploy to Hostinger via FTP
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /domains/alexandersam.me/public_html/
          timeout: 120000

      # Hostinger's FTP endpoint intermittently times out on connect; retry.
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Hostinger via FTP (retry)
        if: steps.deploy1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /domains/alexandersam.me/public_html/
          timeout: 120000
